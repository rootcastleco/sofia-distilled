[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sofia-distilled"
version = "0.1.0"
description = "Reproducible experimental distillation for machine signals and English technical chat"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
chat = ["torch>=2.7,<2.8", "transformers==4.57.1", "peft==0.17.1", "accelerate>=1.0,<2", "safetensors>=0.5,<1"]
hub = ["huggingface_hub>=0.34,<1"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
sofia-distilled = "sofia_distilled.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
